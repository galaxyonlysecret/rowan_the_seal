<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>海豹「秋」 - Phaser 3 手繪風育成手遊</title>
    <!-- Tailwind CSS for smooth modern HTML overlay UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Phaser 3 Game Engine -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.0/dist/phaser.min.js"></script>
    <!-- Google Fonts for cute Japanese/Hand-drawn aesthetic -->
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            background-color: #f3f0e6;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        /* Mobile interactive button optimizations */
        button, .btn-touch {
            touch-action: manipulation !important;
            -webkit-tap-highlight-color: transparent;
            cursor: pointer;
        }
        .touch-drag-area {
            touch-action: none;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-amber-50 min-h-screen min-h-[100dvh] w-screen flex flex-col items-center justify-center p-0 sm:p-4 text-slate-800 overflow-x-hidden overflow-y-auto">

    <!-- Main Game Container Mocking Mobile Device Screen -->
    <div class="relative w-full max-w-md h-[100dvh] max-h-[850px] sm:h-[92vh] bg-sky-50 rounded-none sm:rounded-3xl border-0 sm:border-4 border-amber-200 shadow-2xl flex flex-col overflow-hidden my-auto">
        
        <!-- Top Status Bar (HUD) -->
        <div class="p-2.5 sm:p-3 bg-white/95 backdrop-blur-md border-b border-amber-100 flex flex-col gap-1 z-20 shadow-sm relative shrink-0">
            <div class="flex items-center justify-between">
                <!-- Level & Exp Bar -->
                <div class="flex flex-col flex-1 mr-2 sm:mr-3">
                    <div class="flex justify-between items-center mb-0.5 sm:mb-1">
                        <span id="ui-level" class="font-black text-amber-600 text-xs sm:text-base">Lv.1 秋</span>
                        <span id="ui-exp-text" class="text-[10px] sm:text-xs text-amber-700 font-bold">0 / 200 EXP</span>
                    </div>
                    <div class="w-full bg-amber-100 h-2.5 rounded-full overflow-hidden p-0.5 border border-amber-200">
                        <div id="ui-exp-bar" class="bg-gradient-to-r from-amber-400 to-orange-400 h-full rounded-full transition-all duration-300" style="width: 0%"></div>
                    </div>
                </div>

                <!-- Energy & Coin Indicators -->
                <div class="flex items-center gap-1 sm:gap-1.5">
                    <!-- Coins -->
                    <div class="flex items-center bg-amber-100/90 px-2 sm:px-2.5 py-1 rounded-2xl border border-amber-300 shadow-inner">
                        <span class="text-xs sm:text-sm mr-0.5 sm:mr-1">💰</span>
                        <span id="ui-coins" class="font-black text-amber-800 text-xs sm:text-sm">0</span>
                    </div>
                    <!-- Energy Indicator & Buy Button -->
                    <div class="flex items-center bg-amber-100/90 px-1.5 sm:px-2 py-1 rounded-2xl border border-amber-300 shadow-inner">
                        <span class="text-xs sm:text-sm mr-0.5 sm:mr-1">⚡</span>
                        <span id="ui-energy" class="font-black text-amber-800 text-xs sm:text-sm">5/5</span>
                        <button id="btn-buy-energy" class="btn-touch ml-1 px-1.5 py-0.5 bg-amber-500 hover:bg-amber-600 active:scale-90 text-white font-black text-[10px] rounded-lg shadow transition-all" title="購買 1 體力 (30💰)">+買</button>
                    </div>
                </div>
            </div>

            <!-- Energy Recovery Subtitle Status -->
            <div class="flex justify-between items-center text-[10px] font-bold text-amber-700/80 px-0.5">
                <span id="ui-energy-timer">下1點回復: --:--</span>
                <span id="ui-buy-limit-text">今日購買: 0/5</span>
            </div>
        </div>

        <!-- Phaser Game Canvas Area -->
        <div id="phaser-container" class="relative flex-1 w-full min-h-0 flex items-center justify-center overflow-hidden touch-drag-area">
            <!-- Phaser Canvas will render here automatically -->
        </div>

        <!-- Floating Dialog / Toast Notice -->
        <div id="toast-notice" class="absolute top-20 left-1/2 -translate-x-1/2 bg-amber-900/90 text-white px-4 py-2 rounded-full text-xs font-bold shadow-lg opacity-0 transition-all duration-300 pointer-events-none z-30 text-center max-w-[85%]">
            已成功獲得小魚！
        </div>

        <!-- Bottom Action Bar & Inventory Drawer -->
        <div class="bg-white/95 backdrop-blur-md p-2.5 sm:p-3 border-t border-amber-100 z-20 flex flex-col gap-1.5 relative shrink-0">
            
            <!-- Category Tabs / Buttons -->
            <div class="flex justify-between items-center px-0.5">
                <div class="flex items-center gap-1">
                    <span class="text-[11px] sm:text-xs font-bold text-slate-500">🐟 背包食物 (按住拖拽/點擊餵食)</span>
                </div>
                <div class="flex gap-1.5">
                    <button id="btn-adventure" class="btn-touch px-2.5 sm:px-3 py-1 sm:py-1.5 bg-sky-500 hover:bg-sky-600 active:scale-95 text-white font-bold text-xs rounded-xl shadow-md transition-all flex items-center gap-1">
                        ⛺ 探險地圖
                    </button>
                    <button id="btn-toggle-fast" class="btn-touch px-2 py-1 bg-amber-200 text-amber-900 hover:bg-amber-300 font-bold text-[10px] rounded-xl transition-all">
                        ⚡ 測試速過: <span id="fast-mode-text">關閉</span>
                    </button>
                </div>
            </div>

            <!-- Food Inventory Items Carousel -->
            <div id="inventory-tray" class="flex gap-2 overflow-x-auto py-1.5 px-0.5 no-scrollbar min-h-[72px] items-center touch-drag-area">
                <!-- Dynamic food items will be injected here -->
            </div>
        </div>

        <!-- Adventure Modal Overlay -->
        <div id="modal-adventure" class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex-col justify-end transition-all">
            <div class="bg-amber-50 rounded-t-3xl p-4 sm:p-5 border-t-4 border-amber-300 max-h-[85vh] overflow-y-auto flex flex-col gap-3.5 shadow-2xl">
                <div class="flex justify-between items-center border-b border-amber-200 pb-2.5">
                    <div>
                        <h2 class="font-black text-base sm:text-lg text-amber-900">🗺️ 「秋」的探險小旅程</h2>
                        <p class="text-[11px] sm:text-xs text-amber-700">派遣海豹出門探險帶回豐盛美食與金幣！</p>
                    </div>
                    <button id="btn-close-adventure" class="btn-touch w-8 h-8 sm:w-9 sm:h-9 rounded-full bg-amber-200 text-amber-800 font-black flex items-center justify-center hover:bg-amber-300 active:scale-90 text-sm sm:text-base">✕</button>
                </div>

                <!-- Adventure Locations List -->
                <div id="adventure-list" class="flex flex-col gap-2.5">
                    <!-- Dynamic Adventure cards rendered via JS -->
                </div>
            </div>
        </div>

    </div>

    <script>
        // =========================================================================
        // 1. GAME CONSTANTS & DATA DEFINITIONS
        // =========================================================================
        const MAX_LEVEL = 7;
        const EXP_TABLE = [0, 0, 200, 700, 1700, 3500, 6500, 11000];
        const MAX_ENERGY = 5;
        const RECOVERY_INTERVAL_SEC = 600; // 10 mins
        const DAILY_RECOVERY_LIMIT = 15;
        const BUY_ENERGY_COST = 30;
        const DAILY_BUY_LIMIT = 5;

        const FOOD_TYPES = {
            fish: { id: 'fish', name: '普通小魚', exp: 10, color: 0x4A90E2, icon: '🐟', desc: '鮮美的小甜點' },
            shrimp: { id: 'shrimp', name: '蝦仔', exp: 25, color: 0xFF7675, icon: '🦐', desc: '彈牙Q彈的鮮蝦' },
            boba: { id: 'boba', name: '珍珠奶茶', exp: 50, color: 0xE1B12C, icon: '🧋', desc: '海豹最愛的半糖少冰' },
            fishball: { id: 'fishball', name: '咖哩魚蛋', exp: 100, color: 0xFBC531, icon: '🍢', desc: '街頭地道濃郁風味' },
            noodle: { id: 'noodle', name: '譚仔米線', exp: 250, color: 0xEE5253, icon: '🍜', desc: '特辣過橋米線奢華大餐' }
        };

        const ADVENTURE_LOCATIONS = [
            { id: 'park', name: '公園', icon: '🛝', normalTimeSec: 300, fastTimeSec: 10, energyCost: 1, minCoins: 0, maxCoins: 10, drops: [ { id: 'fish', rate: 0.8 }, { id: 'shrimp', rate: 0.2 } ] },
            { id: 'practice_room', name: '練習室', icon: '🎤', normalTimeSec: 900, fastTimeSec: 25, energyCost: 1, minCoins: 3, maxCoins: 15, drops: [ { id: 'shrimp', rate: 0.6 }, { id: 'boba', rate: 0.4 } ] },
            { id: 'tv_station', name: '電視台', icon: '📺', normalTimeSec: 1800, fastTimeSec: 45, energyCost: 1, minCoins: 10, maxCoins: 30, drops: [ { id: 'boba', rate: 0.5 }, { id: 'fishball', rate: 0.4 }, { id: 'noodle', rate: 0.1 } ] },
            { id: 'tamjai_shop', name: '譚仔門市', icon: '🌶️', normalTimeSec: 3600, fastTimeSec: 60, energyCost: 2, minCoins: 20, maxCoins: 50, drops: [ { id: 'fishball', rate: 0.4 }, { id: 'noodle', rate: 0.6 } ] }
        ];

        const SEAL_SKINS = {
            1: { title: "經典小白海豹", accessory: null },
            2: { title: "頭頂小芽秋", accessory: "sprout" },
            3: { title: "水手水蜜桃秋", accessory: "hat" },
            4: { title: "珍奶眼鏡時尚秋", accessory: "glasses" },
            5: { title: "星星皇冠國王秋", accessory: "crown" },
            6: { title: "小天使翅膀秋", accessory: "wings" },
            7: { title: "黃金閃耀海豹神", accessory: "aura" }
        };

        const STORAGE_KEY = 'AkiSealGame_SaveData_v1';

        function loadGameState() {
            const saved = localStorage.getItem(STORAGE_KEY);
            let defaultState = {
                level: 1,
                exp: 0,
                energy: MAX_ENERGY,
                coins: 0,
                lastEnergyTimer: new Date().getTime(),
                dailyRecoveredEnergy: 0,
                dailyPurchasedEnergy: 0,
                lastEnergyReset: new Date().getTime(),
                inventory: { fish: 5, shrimp: 2, boba: 1, fishball: 0, noodle: 0 },
                activeAdventures: {},
                fastMode: false
            };

            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    const lastReset = new Date(parsed.lastEnergyReset || 0);
                    const today = new Date();
                    
                    defaultState = {
                        ...defaultState,
                        ...parsed,
                        inventory: { ...defaultState.inventory, ...(parsed.inventory || {}) },
                        activeAdventures: parsed.activeAdventures || {}
                    };

                    if (lastReset.toDateString() !== today.toDateString()) {
                        defaultState.energy = MAX_ENERGY;
                        defaultState.dailyRecoveredEnergy = 0;
                        defaultState.dailyPurchasedEnergy = 0;
                        defaultState.lastEnergyReset = today.getTime();
                        defaultState.lastEnergyTimer = today.getTime();
                    }
                    return defaultState;
                } catch(e) { 
                    console.error("Error loading save", e); 
                }
            }
            return defaultState;
        }

        let gameState = loadGameState();

        function saveGameState() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(gameState));
            } catch(e) {}
        }

        function processEnergyAutoRecovery() {
            const now = Date.now();
            const todayStr = new Date(now).toDateString();
            const lastResetStr = new Date(gameState.lastEnergyReset || 0).toDateString();

            if (todayStr !== lastResetStr) {
                gameState.dailyRecoveredEnergy = 0;
                gameState.dailyPurchasedEnergy = 0;
                gameState.lastEnergyReset = now;
                gameState.lastEnergyTimer = now;
                saveGameState();
            }

            const intervalSec = gameState.fastMode ? 10 : RECOVERY_INTERVAL_SEC;
            const intervalMs = intervalSec * 1000;

            if (!gameState.lastEnergyTimer) {
                gameState.lastEnergyTimer = now;
            }

            const diffMs = now - gameState.lastEnergyTimer;
            if (diffMs >= intervalMs) {
                const steps = Math.floor(diffMs / intervalMs);
                let restored = 0;

                for (let i = 0; i < steps; i++) {
                    if (gameState.energy < MAX_ENERGY && gameState.dailyRecoveredEnergy < DAILY_RECOVERY_LIMIT) {
                        gameState.energy++;
                        gameState.dailyRecoveredEnergy++;
                        restored++;
                    } else {
                        break;
                    }
                }

                gameState.lastEnergyTimer += steps * intervalMs;
                if (restored > 0) {
                    showToast(`⚡ 體力自動恢復 +${restored}！(今日已恢復 ${gameState.dailyRecoveredEnergy}/${DAILY_RECOVERY_LIMIT})`);
                }
                saveGameState();
            }
        }

        function buyEnergyWithCoins() {
            if (gameState.coins < BUY_ENERGY_COST) {
                showToast(`💰 金幣不足！購買 1 體力需要 ${BUY_ENERGY_COST} 金幣。`);
                return;
            }
            if (gameState.dailyPurchasedEnergy >= DAILY_BUY_LIMIT) {
                showToast(`⚠️ 今日購買次數已達上限 (${DAILY_BUY_LIMIT}/${DAILY_BUY_LIMIT})！`);
                return;
            }

            gameState.coins -= BUY_ENERGY_COST;
            gameState.energy += 1;
            gameState.dailyPurchasedEnergy += 1;
            saveGameState();
            updateHUDUI();
            showToast(`⚡ 購買成功！體力+1 (今日已買 ${gameState.dailyPurchasedEnergy}/${DAILY_BUY_LIMIT})`);
        }

        const playSynthSFX = (type) => {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                const ctx = new AudioCtx();
                if (ctx.state === 'suspended') {
                    ctx.resume();
                }
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);

                if (type === 'eat') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(300, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(600, ctx.currentTime + 0.12);
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.12);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.12);
                } else if (type === 'levelup') {
                    const now = ctx.currentTime;
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.setValueAtTime(600, now + 0.1);
                    osc.frequency.setValueAtTime(800, now + 0.2);
                    gain.gain.setValueAtTime(0.4, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                    osc.start();
                    osc.stop(now + 0.4);
                }
            } catch(e) {}
        };

        // =========================================================================
        // 2. PHASER 3 SCENE IMPLEMENTATION
        // =========================================================================
        class SealMainScene extends Phaser.Scene {
            constructor() {
                super('SealMainScene');
                this.activeFoodSprite = null;
            }

            preload() {
                // 🎨 載入玩家上傳的自訂 PNG 手繪皮膚 (seal_lvl1.png ~ seal_lvl7.png)
                for (let i = 1; i <= 7; i++) {
                    this.load.image(`seal_lvl${i}`, `seal_lvl${i}.png`);
                }

                // 備用與幾何圖案繪製
                this.createSealTextures();
            }

            createSealTextures() {
                const graphics = this.make.graphics({x: 0, y: 0, add: false});
                
                // Seal Body Fallback
                graphics.fillStyle(0xFFFAF0, 1);
                graphics.fillRoundedRect(20, 40, 180, 120, 55);
                graphics.fillTriangle(180, 100, 220, 70, 220, 130);
                graphics.fillRoundedRect(40, 130, 45, 25, 12);

                // Cheek Blush
                graphics.fillStyle(0xFFB6C1, 0.6);
                graphics.fillCircle(55, 95, 12);
                graphics.fillCircle(115, 95, 12);

                // Eyes & Nose
                graphics.fillStyle(0x2D3436, 1);
                graphics.fillCircle(65, 80, 6);
                graphics.fillCircle(105, 80, 6);
                graphics.fillStyle(0xFFFFFF, 1);
                graphics.fillCircle(63, 78, 2);
                graphics.fillCircle(103, 78, 2);
                graphics.fillStyle(0x2D3436, 1);
                graphics.fillCircle(85, 87, 4);

                graphics.generateTexture('seal_base', 230, 170);
                graphics.clear();

                // Heart Texture
                graphics.fillStyle(0xFF4757, 1);
                graphics.fillCircle(15, 15, 12);
                graphics.generateTexture('heart_fx', 30, 30);
            }

            create() {
                const width = this.cameras.main.width;
                const height = this.cameras.main.height;

                // Background Decor
                this.add.circle(width / 2, height / 2 + 10, 140, 0xFEF3C7, 0.6);
                
                // Main Seal Container
                this.sealContainer = this.add.container(width / 2, height / 2 + 10);
                
                // 預設為中心對齊 (Origin 0.5, 0.5)
                this.sealSprite = this.add.sprite(0, 0, 'seal_base').setOrigin(0.5, 0.5);
                this.sealContainer.add(this.sealSprite);

                // Accessory Graphics container for Fallback Skins
                this.accessoryGraphics = this.add.graphics();
                this.sealContainer.add(this.accessoryGraphics);

                // Seal Name
                this.sealNameText = this.add.text(0, -100, '秋 (Aki)', {
                    fontFamily: 'M PLUS Rounded 1c',
                    fontSize: '22px',
                    fontWeight: '900',
                    color: '#92400E'
                }).setOrigin(0.5);
                this.sealContainer.add(this.sealNameText);

                // Subtitle Skin Title
                this.skinTitleText = this.add.text(0, -75, '', {
                    fontFamily: 'M PLUS Rounded 1c',
                    fontSize: '12px',
                    fontWeight: '700',
                    color: '#B45309'
                }).setOrigin(0.5);
                this.sealContainer.add(this.skinTitleText);

                // Idle Gentle Bouncing
                this.tweens.add({
                    targets: this.sealContainer,
                    y: height / 2,
                    scaleY: 1.03,
                    scaleX: 0.98,
                    duration: 1800,
                    yoyo: true,
                    repeat: -1,
                    ease: 'Sine.easeInOut'
                });

                this.updateSealSkin();
            }

            updateSealSkin() {
                this.accessoryGraphics.clear();
                const lvl = gameState.level;
                const skin = SEAL_SKINS[lvl] || SEAL_SKINS[1];
                
                this.skinTitleText.setText(`[ Skin: ${skin.title} ]`);

                const customTextureKey = `seal_lvl${lvl}`;

                // 🔥 優先檢測玩家是否有上傳並成功載入 custom PNG 圖片！
                if (this.textures.exists(customTextureKey) && this.textures.get(customTextureKey).key !== '__DEFAULT') {
                    this.sealSprite.setTexture(customTextureKey);
                    this.sealSprite.clearTint();
                    
                    // 可調整自訂圖片在手機畫面的顯示大小比例（預設設定為 0.55）
                    this.sealSprite.setScale(0.55);
                } else {
                    // 若沒有上傳 PNG，則回退使用預設程式繪製圖案
                    this.sealSprite.setTexture('seal_base');
                    this.sealSprite.setScale(1.0);

                    if (lvl >= 2) {
                        this.accessoryGraphics.fillStyle(0x10B981, 1);
                        this.accessoryGraphics.fillCircle(-25, -55, 8);
                        this.accessoryGraphics.fillTriangle(-25, -55, -15, -70, -35, -65);
                    }
                    if (lvl >= 3) {
                        this.accessoryGraphics.fillStyle(0xEF4444, 1);
                        this.accessoryGraphics.fillRect(-35, -55, 20, 8);
                    }
                    if (lvl >= 4) {
                        this.accessoryGraphics.lineStyle(3, 0x1E293B, 1);
                        this.accessoryGraphics.strokeCircle(-35, -20, 10);
                        this.accessoryGraphics.strokeCircle(-5, -20, 10);
                        this.accessoryGraphics.lineBetween(-25, -20, -15, -20);
                    }
                    if (lvl >= 5) {
                        this.accessoryGraphics.fillStyle(0xF59E0B, 1);
                        this.accessoryGraphics.fillTriangle(-40, -50, -20, -75, -20, -50);
                        this.accessoryGraphics.fillTriangle(-20, -50, 0, -80, 0, -50);
                    }
                    if (lvl >= 6) {
                        this.accessoryGraphics.fillStyle(0xFFFFFF, 0.9);
                        this.accessoryGraphics.fillEllipse(60, -10, 40, 20);
                    }
                    if (lvl >= 7) {
                        this.sealSprite.setTint(0xFFE600);
                    } else {
                        this.sealSprite.clearTint();
                    }
                }
            }

            spawnFloatingFood(foodId, startX, startY) {
                if (this.activeFoodSprite) {
                    this.activeFoodSprite.destroy();
                }

                const food = FOOD_TYPES[foodId];
                if (!food) return;

                const container = this.add.container(startX, startY);
                const circle = this.add.circle(0, 0, 24, food.color);
                const text = this.add.text(0, 0, food.icon, { fontSize: '22px' }).setOrigin(0.5);
                container.add([circle, text]);
                container.setDepth(100);

                this.activeFoodSprite = container;
                this.activeFoodId = foodId;
            }

            updateFloatingFoodPos(x, y) {
                if (this.activeFoodSprite) {
                    this.activeFoodSprite.setPosition(x, y);
                }
            }

            finishFeedingCheck(x, y) {
                if (!this.activeFoodSprite) return;

                const dist = Phaser.Math.Distance.Between(
                    x, y, 
                    this.sealContainer.x, this.sealContainer.y
                );

                if (dist < 140) {
                    this.feedSeal(this.activeFoodId);
                    this.activeFoodSprite.destroy();
                } else {
                    this.tweens.add({
                        targets: this.activeFoodSprite,
                        alpha: 0,
                        scale: 0.5,
                        duration: 250,
                        onComplete: () => {
                            if (this.activeFoodSprite) this.activeFoodSprite.destroy();
                            this.activeFoodSprite = null;
                        }
                    });
                }
                this.activeFoodSprite = null;
            }

            feedSeal(foodId) {
                const food = FOOD_TYPES[foodId];
                if (!food || gameState.inventory[foodId] <= 0) return;

                gameState.inventory[foodId]--;
                saveGameState();
                renderInventoryUI();

                playSynthSFX('eat');

                this.tweens.add({
                    targets: this.sealContainer,
                    scaleX: 1.18,
                    scaleY: 1.18,
                    duration: 140,
                    yoyo: true,
                    repeat: 1
                });

                for(let i = 0; i < 5; i++) {
                    const heart = this.add.image(
                        this.sealContainer.x + Phaser.Math.Between(-40, 40),
                        this.sealContainer.y + Phaser.Math.Between(-20, 20),
                        'heart_fx'
                    ).setScale(0.6);

                    this.tweens.add({
                        targets: heart,
                        y: heart.y - 70,
                        alpha: 0,
                        scale: 1.1,
                        duration: 700 + i * 100,
                        onComplete: () => heart.destroy()
                    });
                }

                const expText = this.add.text(
                    this.sealContainer.x,
                    this.sealContainer.y - 60,
                    `+${food.exp} EXP`,
                    { fontFamily: 'M PLUS Rounded 1c', fontSize: '24px', fontWeight: '900', color: '#D97706', stroke: '#FFFFFF', strokeThickness: 4 }
                ).setOrigin(0.5);

                this.tweens.add({
                    targets: expText,
                    y: expText.y - 50,
                    alpha: 0,
                    duration: 1000,
                    onComplete: () => expText.destroy()
                });

                addExp(food.exp);
            }
        }

        let phaserGame;
        function initPhaser() {
            const config = {
                type: Phaser.AUTO,
                parent: 'phaser-container',
                width: 380,
                height: 520,
                transparent: true,
                scene: [SealMainScene],
                scale: {
                    mode: Phaser.Scale.FIT,
                    autoCenter: Phaser.Scale.CENTER_BOTH
                }
            };
            phaserGame = new Phaser.Game(config);
        }

        function showToast(msg) {
            const toast = document.getElementById('toast-notice');
            toast.innerText = msg;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            toast.classList.add('opacity-100');
            setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 2000);
        }

        function addExp(amount) {
            if (gameState.level >= MAX_LEVEL) {
                showToast("海豹已經達到滿級 Lv.7 囉！");
                return;
            }

            gameState.exp += amount;

            while (gameState.level < MAX_LEVEL && gameState.exp >= EXP_TABLE[gameState.level + 1]) {
                gameState.level++;
                playSynthSFX('levelup');
                showToast(`🎉 恭喜！「秋」升級到了 Lv.${gameState.level}！`);
                
                const mainScene = phaserGame.scene.getScene('SealMainScene');
                if (mainScene) mainScene.updateSealSkin();
            }

            if (gameState.level === MAX_LEVEL && gameState.exp > EXP_TABLE[MAX_LEVEL]) {
                gameState.exp = EXP_TABLE[MAX_LEVEL];
            }

            saveGameState();
            updateHUDUI();
        }

        function updateHUDUI() {
            processEnergyAutoRecovery();

            document.getElementById('ui-level').innerText = `Lv.${gameState.level} 秋`;
            
            const nextReq = gameState.level < MAX_LEVEL ? EXP_TABLE[gameState.level + 1] : EXP_TABLE[MAX_LEVEL];
            document.getElementById('ui-exp-text').innerText = `${gameState.exp} / ${nextReq} EXP`;
            
            const pct = Math.min(100, Math.floor((gameState.exp / nextReq) * 100));
            document.getElementById('ui-exp-bar').style.width = `${pct}%`;

            document.getElementById('ui-energy').innerText = `${gameState.energy}/${MAX_ENERGY}`;
            document.getElementById('ui-coins').innerText = gameState.coins || 0;
            document.getElementById('ui-buy-limit-text').innerText = `今日購買: ${gameState.dailyPurchasedEnergy || 0}/${DAILY_BUY_LIMIT}`;
            document.getElementById('fast-mode-text').innerText = gameState.fastMode ? "開啟" : "關閉";

            const timerSubtext = document.getElementById('ui-energy-timer');
            if (timerSubtext) {
                if (gameState.dailyRecoveredEnergy >= DAILY_RECOVERY_LIMIT) {
                    timerSubtext.innerText = "今日自動回復已達上限 (15/15)";
                } else if (gameState.energy >= MAX_ENERGY) {
                    timerSubtext.innerText = "體力已滿";
                } else {
                    const intervalSec = gameState.fastMode ? 10 : RECOVERY_INTERVAL_SEC;
                    const elapsedSec = Math.floor((Date.now() - (gameState.lastEnergyTimer || Date.now())) / 1000);
                    const remSec = Math.max(0, intervalSec - elapsedSec);
                    const m = Math.floor(remSec / 60);
                    const s = remSec % 60;
                    timerSubtext.innerText = `下1點: ${m}:${s < 10 ? '0' : ''}${s} (今日已恢復 ${gameState.dailyRecoveredEnergy}/15)`;
                }
            }
        }

        function renderInventoryUI() {
            const tray = document.getElementById('inventory-tray');
            tray.innerHTML = '';

            Object.values(FOOD_TYPES).forEach(food => {
                const count = gameState.inventory[food.id] || 0;
                
                const itemEl = document.createElement('div');
                itemEl.className = `flex-shrink-0 flex flex-col items-center p-2 rounded-2xl border-2 transition-all select-none touch-drag-area ${
                    count > 0 
                    ? 'bg-amber-100/80 border-amber-300 cursor-pointer active:scale-95 hover:scale-105' 
                    : 'bg-slate-100 border-slate-200 opacity-50 grayscale'
                }`;

                itemEl.innerHTML = `
                    <div class="text-2xl mb-0.5">${food.icon}</div>
                    <div class="text-[10px] font-black text-amber-900">${food.name}</div>
                    <div class="text-[9px] font-bold text-amber-600">+${food.exp} EXP</div>
                    <div class="mt-0.5 px-2 py-0.5 bg-amber-500 text-white font-black text-[10px] rounded-full">x${count}</div>
                `;

                if (count > 0) {
                    let isDragging = false;

                    const getCanvasPos = (e) => {
                        const scene = phaserGame.scene.getScene('SealMainScene');
                        if (!scene) return { x: 190, y: 260 };
                        const canvas = phaserGame.canvas;
                        const rect = canvas.getBoundingClientRect();
                        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                        
                        const scaleX = scene.cameras.main.width / rect.width;
                        const scaleY = scene.cameras.main.height / rect.height;

                        return {
                            x: (clientX - rect.left) * scaleX,
                            y: (clientY - rect.top) * scaleY
                        };
                    };

                    const onPointerMove = (e) => {
                        if (!isDragging) return;
                        const pos = getCanvasPos(e);
                        const scene = phaserGame.scene.getScene('SealMainScene');
                        if (scene) scene.updateFloatingFoodPos(pos.x, pos.y);
                    };

                    const onPointerUp = (e) => {
                        if (!isDragging) return;
                        isDragging = false;
                        window.removeEventListener('pointermove', onPointerMove);
                        window.removeEventListener('pointerup', onPointerUp);
                        window.removeEventListener('touchmove', onPointerMove);
                        window.removeEventListener('touchend', onPointerUp);

                        const pos = getCanvasPos(e.changedTouches ? e.changedTouches[0] : e);
                        const scene = phaserGame.scene.getScene('SealMainScene');
                        if (scene) scene.finishFeedingCheck(pos.x, pos.y);
                    };

                    itemEl.addEventListener('pointerdown', (e) => {
                        const scene = phaserGame.scene.getScene('SealMainScene');
                        if (!scene) return;
                        
                        isDragging = true;
                        const pos = getCanvasPos(e);
                        scene.spawnFloatingFood(food.id, pos.x, pos.y);

                        window.addEventListener('pointermove', onPointerMove);
                        window.addEventListener('pointerup', onPointerUp);
                        window.addEventListener('touchmove', onPointerMove);
                        window.addEventListener('touchend', onPointerUp);
                    });
                }

                tray.appendChild(itemEl);
            });
        }

        function renderAdventureModal() {
            const container = document.getElementById('adventure-list');
            container.innerHTML = '';

            const now = Date.now();

            ADVENTURE_LOCATIONS.forEach(loc => {
                const activeTime = gameState.activeAdventures[loc.id];
                const durationSec = gameState.fastMode ? loc.fastTimeSec : loc.normalTimeSec;
                
                let isRunning = false;
                let isCompleted = false;
                let remainingSec = 0;

                if (activeTime) {
                    const elapsedSec = Math.floor((now - activeTime) / 1000);
                    if (elapsedSec >= durationSec) {
                        isCompleted = true;
                    } else {
                        isRunning = true;
                        remainingSec = durationSec - elapsedSec;
                    }
                }

                const card = document.createElement('div');
                card.className = "bg-white p-3 rounded-2xl border border-amber-200 shadow-sm flex items-center justify-between";

                const formatTime = (s) => {
                    const m = Math.floor(s / 60);
                    const sec = s % 60;
                    return `${m}:${sec < 10 ? '0' : ''}${sec}`;
                };

                let actionBtnHTML = '';
                if (isCompleted) {
                    actionBtnHTML = `<button data-action="claim-adventure" data-loc-id="${loc.id}" class="btn-touch px-3 py-1.5 bg-emerald-500 hover:bg-emerald-600 text-white font-black text-xs rounded-xl shadow-md animate-bounce">🎁 領取獎勵</button>`;
                } else if (isRunning) {
                    actionBtnHTML = `<div class="px-2.5 py-1 bg-amber-100 text-amber-800 font-bold text-xs rounded-xl border border-amber-300">⏳ ${formatTime(remainingSec)}</div>`;
                } else {
                    actionBtnHTML = `<button data-action="start-adventure" data-loc-id="${loc.id}" class="btn-touch px-3 py-1.5 bg-amber-500 hover:bg-amber-600 text-white font-black text-xs rounded-xl shadow-md active:scale-95">出發 (-${loc.energyCost}⚡)</button>`;
                }

                card.innerHTML = `
                    <div class="flex items-center gap-2.5">
                        <div class="text-2xl sm:text-3xl p-1.5 bg-amber-100 rounded-2xl">${loc.icon}</div>
                        <div>
                            <div class="font-black text-amber-900 text-xs sm:text-sm">${loc.name}</div>
                            <div class="text-[10px] sm:text-[11px] text-amber-700 font-bold">耗時: ${durationSec >= 60 ? (durationSec/60)+'分鐘' : durationSec+'秒'}</div>
                            <div class="text-[9px] sm:text-[10px] text-slate-500">食物: ${loc.drops.map(d => FOOD_TYPES[d.id].name).join(', ')}</div>
                            <div class="text-[9px] sm:text-[10px] text-amber-600 font-black">💰 金幣: ${loc.minCoins} ~ ${loc.maxCoins}</div>
                        </div>
                    </div>
                    <div>${actionBtnHTML}</div>
                `;

                container.appendChild(card);
            });
        }

        window.startAdventure = function(locId) {
            const loc = ADVENTURE_LOCATIONS.find(l => l.id === locId);
            if (!loc) return;

            if (gameState.energy < loc.energyCost) {
                showToast("⚡ 體力不足！可以購買體力或等待自動恢復。");
                return;
            }

            gameState.energy -= loc.energyCost;
            gameState.activeAdventures[locId] = Date.now();
            saveGameState();
            updateHUDUI();
            renderAdventureModal();
            showToast(`已派遣「秋」前往${loc.name}探險！`);
        };

        window.claimAdventureReward = function(locId) {
            const loc = ADVENTURE_LOCATIONS.find(l => l.id === locId);
            if (!loc) return;

            const rand = Math.random();
            let cumulative = 0;
            let droppedFoodId = loc.drops[0].id;

            for (let drop of loc.drops) {
                cumulative += drop.rate;
                if (rand <= cumulative) {
                    droppedFoodId = drop.id;
                    break;
                }
            }

            const coinsEarned = Math.floor(Math.random() * (loc.maxCoins - loc.minCoins + 1)) + loc.minCoins;

            gameState.inventory[droppedFoodId] = (gameState.inventory[droppedFoodId] || 0) + 1;
            gameState.coins = (gameState.coins || 0) + coinsEarned;
            delete gameState.activeAdventures[locId];

            saveGameState();
            renderInventoryUI();
            renderAdventureModal();
            updateHUDUI();
            showToast(`🎁 探險歸來！獲得【${FOOD_TYPES[droppedFoodId].name}】與 💰 ${coinsEarned} 金幣！`);
        };

        function bindMobileClick(elementId, callback) {
            const el = document.getElementById(elementId);
            if (!el) return;
            
            let lastTrigger = 0;
            const handler = (e) => {
                const now = Date.now();
                if (now - lastTrigger < 300) return;
                lastTrigger = now;
                e.stopPropagation();
                callback(e);
            };

            el.addEventListener('pointerdown', handler);
            el.addEventListener('click', handler);
        }

        document.addEventListener('DOMContentLoaded', () => {
            initPhaser();
            updateHUDUI();
            renderInventoryUI();

            const modal = document.getElementById('modal-adventure');
            
            bindMobileClick('btn-buy-energy', () => {
                buyEnergyWithCoins();
            });

            bindMobileClick('btn-adventure', () => {
                try {
                    renderAdventureModal();
                } catch(err) {
                    console.error("Render adventure error:", err);
                }
                modal.classList.remove('hidden');
                modal.classList.add('flex');
            });

            bindMobileClick('btn-close-adventure', () => {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            });

            bindMobileClick('btn-toggle-fast', () => {
                gameState.fastMode = !gameState.fastMode;
                saveGameState();
                updateHUDUI();
                renderAdventureModal();
                showToast(`測試速過模式已${gameState.fastMode ? '開啟 (秒級)' : '關閉 (分鐘級)'}`);
            });

            const adventureListEl = document.getElementById('adventure-list');
            let lastAdventureTap = 0;
            const handleAdventureClick = (e) => {
                const now = Date.now();
                if (now - lastAdventureTap < 300) return;

                const startBtn = e.target.closest('[data-action="start-adventure"]');
                if (startBtn) {
                    lastAdventureTap = now;
                    e.stopPropagation();
                    const locId = startBtn.getAttribute('data-loc-id');
                    startAdventure(locId);
                    return;
                }
                const claimBtn = e.target.closest('[data-action="claim-adventure"]');
                if (claimBtn) {
                    lastAdventureTap = now;
                    e.stopPropagation();
                    const locId = claimBtn.getAttribute('data-loc-id');
                    claimAdventureReward(locId);
                    return;
                }
            };

            adventureListEl.addEventListener('pointerdown', handleAdventureClick);
            adventureListEl.addEventListener('click', handleAdventureClick);

            setInterval(() => {
                updateHUDUI();
                if (!document.getElementById('modal-adventure').classList.contains('hidden')) {
                    renderAdventureModal();
                }
            }, 1000);
        });
    </script>
</body>
</html>
